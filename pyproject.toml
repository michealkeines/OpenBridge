[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbridge"
version = "0.1.0"
description = "Orchestrate multiple Claude sessions programmatically — pool-based work distribution between Python producers and Claude-session workers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenBridge contributors" },
]
keywords = ["claude", "ai", "agent", "orchestration", "async", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "redis>=4.2",
]

[project.urls]
# Update once published:
# Homepage = "https://github.com/<your-org>/openbridge"
# Documentation = "https://github.com/<your-org>/openbridge#readme"
# Issues = "https://github.com/<your-org>/openbridge/issues"

[project.scripts]
openbridge = "openbridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openbridge*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
openbridge = ["_skills/openbridge/SKILL.md"]
